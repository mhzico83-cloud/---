
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخيمي - إدارة المخيم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-second: #334155;
            --text-muted-custom: #64748b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.3);
            --reg-surface: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
        }

        [data-theme='ocean'] {
            --bg-body: #020617;
            --glass-bg: rgba(15, 23, 42, 0.95);
            --text-main: #f8fafc;
            --text-second: #cbd5e1;
            --text-muted-custom: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --reg-surface: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        * {
            font-family: 'Almarai', 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .text-main { color: var(--text-main) !important; }
        .text-second { color: var(--text-second) !important; }
        .text-muted-custom { color: var(--text-muted-custom) !important; }
        .text-accent { color: var(--accent) !important; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .reg-card {
            background: var(--reg-surface);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-reg {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-reg:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.5);
            filter: brightness(1.1);
        }

        .input-reg {
            background: white;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
            color: #1e293b;
        }

        [data-theme='ocean'] .input-reg {
            background: rgba(15, 23, 42, 0.5);
            border-color: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
        }

        .badge-num {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 10px var(--accent-glow);
        }

        .section-header {
            background: rgba(79, 70, 229, 0.05);
            border-right: 4px solid var(--accent);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
            opacity: 0.5;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .text-main, .text-second, .text-muted-custom { color: black !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
