
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخيمي - إدارة المخيم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* الافتراضي (Classic) - تم تحديثه ليكون تدرج رمادي مع الأرجواني الأصلي */
            --primary-gradient: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            --accent-color: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --bg-body: #0a0a0c;
        }

        /* ستايل المحيط (Ocean) */
        [data-theme='ocean'] {
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --accent-color: #0ea5e9;
            --accent-glow: rgba(14, 165, 233, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --bg-body: #020617;
        }

        /* ستايل الغابة (Forest) */
        [data-theme='forest'] {
            --primary-gradient: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --bg-body: #022c22;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-body);
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }
        
        .bg-vibrant {
            background: var(--primary-gradient);
        }

        .glow {
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .text-accent { color: var(--accent-color); }
        .bg-accent { background-color: var(--accent-color); }
        .border-accent { border-color: var(--accent-color); }

        .btn-glow:hover {
            box-shadow: 0 0 30px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* لوحة الدخول - تدرج رمادي احترافي */
        .login-card {
            background: linear-gradient(145deg, rgba(31, 41, 55, 0.9), rgba(17, 24, 39, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        *::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
